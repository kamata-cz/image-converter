# Security Configuration for AI-Driven Issue Resolution System

# Code Analysis Rules
code_restrictions:
  # Prevent these operations in AI-generated code
  forbidden_operations:
    - pattern: "os\\.system\\("
      description: "Direct system calls are not allowed"
      severity: "critical"

    - pattern: "eval\\("
      description: "eval() is not allowed for security reasons"
      severity: "critical"

    - pattern: "exec\\("
      description: "exec() is not allowed for security reasons"
      severity: "critical"

    - pattern: "DROP TABLE"
      description: "Database drop operations must be manual"
      severity: "critical"

    - pattern: "DELETE FROM .* WHERE 1=1"
      description: "Bulk deletes must be manual"
      severity: "critical"

    - pattern: "subprocess\\.call\\(shell=True"
      description: "Shell=True in subprocess is dangerous"
      severity: "high"

  # Files that should never be modified by AI
  protected_paths:
    - ".github/workflows/"
    - "*.pem"
    - "*.key"
    - ".env"
    - ".env.*"
    - "credentials.json"
    - "secrets.yaml"
    - "docker-compose.prod.yml"

  # Directories that require extra caution
  sensitive_directories:
    - "auth/"
    - "security/"
    - "payment/"
    - "billing/"

# Secret Detection
secret_scanning:
  enabled: true

  # Patterns that look like secrets
  secret_patterns:
    - pattern: "(?i)(password|passwd|pwd)\\s*=\\s*['\"][^'\"]{8,}['\"]"
      description: "Potential hardcoded password"

    - pattern: "(?i)(api[_-]?key|apikey)\\s*=\\s*['\"][^'\"]{20,}['\"]"
      description: "Potential hardcoded API key"

    - pattern: "(?i)(secret[_-]?key|secretkey)\\s*=\\s*['\"][^'\"]{20,}['\"]"
      description: "Potential hardcoded secret key"

    - pattern: "(?i)(token)\\s*=\\s*['\"][^'\"]{20,}['\"]"
      description: "Potential hardcoded token"

    - pattern: "(?i)(aws[_-]?access[_-]?key[_-]?id)\\s*=\\s*['\"]AKIA[0-9A-Z]{16}['\"]"
      description: "AWS Access Key ID"

    - pattern: "(?i)(private[_-]?key)\\s*=\\s*['\"]-----BEGIN"
      description: "Private key in code"

# Code Scanning
code_scanning:
  # Enable automated code scanning
  enabled: true

  # Scanners to use
  scanners:
    - name: "codeql"
      enabled: true
      severity_threshold: "medium"

    - name: "bandit"
      enabled: true
      severity_threshold: "medium"

    - name: "semgrep"
      enabled: false
      severity_threshold: "high"

  # Block PR if issues found at or above this severity
  blocking_severity: "high"

# Dependency Security
dependency_scanning:
  enabled: true

  # Check for vulnerable dependencies
  vulnerability_check: true

  # Block if vulnerabilities at or above this severity
  blocking_severity: "high"

  # Allowed licenses
  allowed_licenses:
    - "MIT"
    - "Apache-2.0"
    - "BSD-3-Clause"
    - "BSD-2-Clause"
    - "ISC"
    - "Python-2.0"

  # Blocked licenses
  blocked_licenses:
    - "GPL-3.0"
    - "AGPL-3.0"

# Approval Rules
approval_rules:
  # Require senior developer approval for these changes
  senior_developer_required:
    - security_sensitive_files: true
    - authentication_changes: true
    - authorization_changes: true
    - database_migrations: true

  # Require security team approval
  security_team_required:
    - security_vulnerabilities: true
    - authentication_changes: true
    - encryption_changes: true

  # Automated tests must pass
  automated_tests_must_pass: true

  # Security scans must pass
  security_scans_must_pass: true

# Audit Logging
audit:
  enabled: true

  # Events to log
  log_events:
    - issue_analyzed
    - code_generated
    - pr_created
    - pr_reviewed
    - pr_merged
    - security_issue_detected
    - human_intervention_required

  # Log retention (days)
  retention_days: 90

  # Export logs to external system
  export_enabled: false
  export_endpoint: ""

# Rate Limiting for Security
rate_limits:
  # Maximum number of failed attempts before blocking
  max_failed_attempts: 5

  # Lockout duration (minutes)
  lockout_duration: 30

  # Maximum API calls per minute
  max_api_calls_per_minute: 60

# Emergency Controls
emergency:
  # Kill switch to disable all AI operations
  kill_switch_enabled: false

  # Emergency contacts
  emergency_contacts:
    - email: "security@example.com"
      role: "Security Team"
    - email: "dev-lead@example.com"
      role: "Development Lead"

  # Actions to take in emergency
  emergency_actions:
    - "Disable all AI operations"
    - "Close all open AI-generated PRs"
    - "Notify emergency contacts"
    - "Create incident report"
