name: Iterative Fix Workflow

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  handle-review-feedback:
    # Only run on AI-generated PRs with changes requested
    if: |
      github.event.review.state == 'changes_requested' &&
      contains(github.event.pull_request.labels.*.name, 'ai-generated')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Process Review Feedback
        id: process-feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python -m airs.orchestrator.review_handler \
            --repo=${{ github.repository }} \
            --pr-number=${{ github.event.pull_request.number }} \
            --output=review_feedback.json

      - name: Generate Fixes
        id: generate-fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # This is a simplified version
          # In production, you'd load the original context and generate targeted fixes
          python << 'EOF'
          import json
          import os
          import sys

          # Load review feedback
          with open('review_feedback.json', 'r') as f:
              feedback = json.load(f)

          # Generate fixes using review handler
          from src.orchestrator.review_handler import ReviewHandler
          from src.orchestrator.github_client import GitHubClient

          handler = ReviewHandler()

          # This is simplified - in production you'd load the original context
          print("Generating fixes based on review feedback...")

          # For now, create a marker file
          with open('fixes_needed.txt', 'w') as f:
              f.write(f"Fixes needed based on review by {feedback.get('reviewer', 'unknown')}\n")
              f.write(f"Type: {feedback.get('feedback_type', 'unknown')}\n")
              f.write(f"\nSummary:\n{feedback.get('overall_summary', 'No summary')}\n")

          print("✅ Fix generation complete")
          EOF

      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `## 🔄 Processing Review Feedback

            I've received the review feedback from @${{ github.event.review.user.login }}.

            **Status:** ${github.event.review.state}

            I'm analyzing the feedback and will prepare fixes shortly. This may take a few minutes.

            ### What's Next:
            1. ✅ Review feedback processed
            2. 🔄 Generating fixes (in progress)
            3. ⏳ Applying changes (pending)
            4. ⏳ Pushing updates (pending)

            I'll update this PR once the fixes are ready.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Update Labels
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Remove ready-for-review, add fixing
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'ready-for-human-review'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ai-fixing']
            });

  apply-fixes:
    needs: handle-review-feedback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Apply Generated Fixes
        id: apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # In production, this would apply the actual fixes
          echo "Applying fixes..."
          echo "fixes_applied=true" >> $GITHUB_OUTPUT

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: |
          pytest tests/ -v || echo "tests_failed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.apply.outputs.fixes_applied == 'true'
        run: |
          git config --global user.name 'AI Bot'
          git config --global user.email 'ai-bot@example.com'

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Address review feedback

            Applied fixes based on review comments from ${{ github.event.review.user.login }}

            Co-authored-by: Claude <claude@anthropic.com>"

            git push origin ${{ github.event.pull_request.head.ref }}
          fi

      - name: Update PR with Results
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const testsOk = '${{ steps.tests.outcome }}' === 'success';
            const fixesApplied = '${{ steps.apply.outputs.fixes_applied }}' === 'true';

            let comment = `## ✨ Fixes Applied\n\n`;

            if (fixesApplied) {
              comment += `I've applied fixes based on the review feedback.\n\n`;
              comment += `### Test Results\n`;
              if (testsOk) {
                comment += `✅ All tests passing\n\n`;
              } else {
                comment += `⚠️  Some tests are failing. Investigating...\n\n`;
              }
              comment += `Please review the updated code.`;
            } else {
              comment += `⚠️  No fixes could be applied automatically.\n\n`;
              comment += `This may require manual intervention.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

            // Update labels
            if (fixesApplied && testsOk) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'ai-fixing'
              }).catch(() => {});

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['ready-for-re-review']
              });
            }

  # Limit retry attempts
  check-retry-limit:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'ai-generated')

    steps:
      - name: Check Fix Attempt Count
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAX_RETRIES = 3;

            // Count how many times fixes have been attempted
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const fixAttempts = comments.data.filter(c =>
              c.body.includes('## ✨ Fixes Applied')
            ).length;

            if (fixAttempts >= MAX_RETRIES) {
              const comment = `## ⚠️  Maximum Fix Attempts Reached

              I've attempted to fix the issues ${fixAttempts} times, but there may be complexities that require human intervention.

              **Recommendation:** A human developer should review and complete the remaining changes.
              `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-human-intervention']
              });
            }
