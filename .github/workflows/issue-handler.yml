name: AI Issue Handler

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  analyze-issue:
    if: contains(github.event.issue.labels.*.name, 'ai-resolvable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Analyze Issue Feasibility
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AWS Bedrock (no API key needed)
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -m airs.analyzer.issue_parser \
            --issue-number=$ISSUE_NUMBER \
            --repo=${{ github.repository }}

      - name: Generate Implementation Plan
        if: steps.analyze.outputs.feasible == 'true'
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AWS Bedrock (no API key needed)
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python -m airs.analyzer.context_builder \
            --issue-number=${{ github.event.issue.number }} \
            --output=implementation_plan.json

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const feasible = '${{ steps.analyze.outputs.feasible }}';
            const complexity = '${{ steps.analyze.outputs.complexity }}';
            const estimation = '${{ steps.analyze.outputs.estimation }}';

            let comment = '## 🤖 AI Analysis Complete\n\n';

            if (feasible === 'true') {
              comment += `✅ **This issue is AI-resolvable**\n\n`;
              comment += `- **Complexity**: ${complexity}\n`;
              comment += `- **Estimated Time**: ${estimation}\n`;
              comment += `- **Status**: Starting implementation...\n\n`;
              comment += `I'll create a Pull Request shortly with the proposed solution.`;
            } else {
              comment += `❌ **This issue requires human intervention**\n\n`;
              comment += `**Reason**: ${complexity}\n\n`;
              comment += `Please assign a human developer to handle this issue.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  generate-code:
    needs: analyze-issue
    if: needs.analyze-issue.outputs.feasible == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Implementation Plan
        uses: actions/download-artifact@v3
        with:
          name: implementation-plan

      - name: Generate Code with Claude
        id: generate
        env:
          # AWS Bedrock (no API key needed)
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m airs.generator.code_generator \
            --plan=implementation_plan.json \
            --issue-number=${{ github.event.issue.number }} \
            --repo=${{ github.repository }}

      - name: Generate Tests
        env:
          # AWS Bedrock (no API key needed)
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python -m airs.generator.test_generator \
            --changes=generated_changes.json

      - name: Create Feature Branch
        id: branch
        run: |
          BRANCH_NAME="feature/issue-${{ github.event.issue.number }}-ai-generated"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Apply Generated Changes
        run: |
          python -m airs.orchestrator.apply_changes \
            --changes=generated_changes.json

      - name: Commit Changes
        run: |
          git config --global user.name 'AI Bot'
          git config --global user.email 'ai-bot@example.com'
          git add -A
          git commit -m "feat: AI-generated solution for issue #${{ github.event.issue.number }}

          This commit was automatically generated by Claude Code to resolve:
          ${{ github.event.issue.title }}

          - Implementation based on issue requirements
          - Tests included
          - Code reviewed by AI

          Resolves #${{ github.event.issue.number }}

          Co-authored-by: Claude <claude@anthropic.com>"

      - name: Push Branch
        run: |
          git push origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AI] Fix: ${context.payload.issue.title}`,
              body: `## 🤖 AI-Generated Solution

              This Pull Request was automatically generated to resolve #${context.issue.number}.

              ### 📋 Changes Made
              - ${context.payload.changes_summary || 'See commits for details'}

              ### ✅ Checklist
              - [x] Code generated by Claude Code
              - [x] Tests included
              - [ ] Reviewed by GitHub Copilot (pending)
              - [ ] Approved by human (required)

              ### 🔍 Review Instructions
              1. Check the generated code meets requirements
              2. Verify tests pass
              3. Review security implications
              4. Approve or request changes

              ### ⚠️ Important
              This code was generated by AI and requires human review before merging.

              Resolves #${context.issue.number}`,
              head: '${{ steps.branch.outputs.branch_name }}',
              base: 'main',
              draft: true
            });

            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['ai-generated', 'needs-review']
            });

            // Link to issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📢 Pull Request created: #${pr.data.number}`
            });